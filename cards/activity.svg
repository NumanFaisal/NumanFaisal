<style>@font-face{font-family:'Fira Code';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Fira Code';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.b{font-weight:700}
