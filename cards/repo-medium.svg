<title>medium: Medium clone UI built with TypeScript.</title><desc>medium: Medium clone UI built with TypeScript.</desc>
<style>@font-face{font-family:'Instrument Serif';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Fira Code';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Fira Code';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400}.i{font-style:italic}.b{font-weight:700}
.fade{animation:fade .7s ease-out both}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
.draw{stroke-dasharray:1;animation:draw 1s ease-out both}
