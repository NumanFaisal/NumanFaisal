<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Numan Faisal: Full-stack &amp; AI engineer. Production systems, not prototypes.">
<title>Numan Faisal: Full-stack &amp; AI engineer. Production systems, not prototypes.</title><desc>Numan Faisal, Full-stack &amp; AI engineer. Production systems, not prototypes. Based in Jamshedpur, India.</desc>
<defs>
