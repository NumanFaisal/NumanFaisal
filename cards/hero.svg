circle class="draw" pathLength="1" cx="745" cy="150" r="100" fill="none" stroke="#b983ff" stroke-opacity="0.25" stroke-width="2" style="animation-delay:0.65s"/><g class="pop" style="animation-delay:0.30s"><circle cx="745" cy="150" r="9" fill="#b983ff"/></g><g class="deco"><circle cx="745" cy="150" r="100" fill="none" stroke="#e0c3fc" stroke-opacity=".4" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 745 150" to="360 745 150" dur="40s" repeatCount="indefinite"/></circle></g>
