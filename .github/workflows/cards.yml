name: Refresh profile cards

on:
  schedule:
    - cron: "17 0 * * *"        # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/**"]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli pillow

      - name: Refresh contribution data
        env:
          # PROFILE_TOKEN (classic PAT, read:user) is optional; it lets private contributions count.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
